name: Cross-platform reproducibility

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproduce:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Reproduce all experiments
        run: python -m src.mmip_rag.cli all
      - name: Run official RAGAS metrics
        run: python -m src.mmip_rag.ragas_eval
      - name: Write reproducibility manifest
        run: python -m src.mmip_rag.reproduce
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: outputs-${{ matrix.os }}-py${{ matrix.python-version }}
          path: outputs/

  compare-platforms:
    needs: reproduce
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: outputs-*
          path: ci_artifacts
      - name: Require identical core hashes on all runners
        run: python scripts/compare_manifests.py ci_artifacts
