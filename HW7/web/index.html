<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3C Care Router</title><link rel="stylesheet" href="/web/style.css"></head>
<body><main><aside><div class="brand">NOVA CARE</div><h1>智慧客服分流</h1><p>多輪 × 多模態 × 結構化輸出</p><div class="status"><i></i> 系統正常</div><label>分流方法<select id="method"><option value="prompt">A Prompt</option><option value="sft">B LoRA SFT</option><option value="constraint" selected>C Constraint</option><option value="system_one">D System One</option></select></label><button id="reset">＋ 新對話</button><small>完整模式會分析實際圖片像素與 OCR；圖片中的指令一律視為不可信資料。</small></aside>
<section class="chat"><header><div><b>3C 購物客服</b><span>通常立即回覆</span></div><button id="debug">檢視 JSON</button></header><div id="messages"><article class="bot"><div class="avatar">N</div><div class="bubble">嗨！請描述你的商品、訂單、退貨、維修或付款問題，也可以附上一張照片。<div class="chips"><button>訂單 AB12345 還沒到</button><button>螢幕破損想退貨</button><button>RTX 5080 有庫存嗎</button></div></div></article></div><div id="typing" hidden>正在確認上下文與安全性…</div><footer><div id="preview"></div><div class="composer"><label class="attach">＋<input id="file" type="file" accept="image/*" hidden></label><textarea id="input" rows="1" placeholder="輸入客服問題…"></textarea><button id="send">送出</button></div><p>系統會先確認資訊完整性，再將案件分流至正確部門。</p></footer></section><dialog id="jsonDialog"><button class="close">×</button><h2>最新結構化輸出</h2><pre id="json">尚無資料</pre></dialog></main><script src="/web/app.js"></script></body></html>
